<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">eCoinza payment link with QR code</title>
  <desc id="desc">A polished eCoinza payment link sharing card with a QR code, link field, and sharing actions on a restrained dark background.</desc>
  <defs>
    <radialGradient id="backGlow" cx="52%" cy="46%" r="68%">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#111827" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="stageFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#151719"/>
      <stop offset="1" stop-color="#080909"/>
    </linearGradient>
    <linearGradient id="success" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.56" stop-color="#f8d77a"/>
      <stop offset="1" stop-color="#d9a82e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="stageShadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="cardShadow" x="-14%" y="-18%" width="128%" height="146%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1200" height="740" fill="#050505"/>
  <ellipse cx="720" cy="354" rx="438" ry="258" fill="#0f766e" opacity="0.18" filter="url(#softGlow)"/>
  <ellipse cx="346" cy="202" rx="270" ry="144" fill="#f8d77a" opacity="0.1" filter="url(#softGlow)"/>
  <rect width="1200" height="740" fill="url(#backGlow)"/>

  <g filter="url(#stageShadow)">
    <rect x="98" y="72" width="1004" height="596" rx="48" fill="url(#stageFill)"/>
    <rect x="98" y="72" width="1004" height="596" rx="48" fill="url(#grid)"/>
    <rect x="98" y="72" width="1004" height="596" rx="48" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

    <rect x="168" y="138" width="864" height="476" rx="38" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect x="168" y="138" width="864" height="476" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.75"/>

    <g transform="translate(212 184)">
      <circle cx="24" cy="24" r="24" fill="#0f766e"/>
      <text x="24" y="33" text-anchor="middle" fill="#fff7d6" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="24" font-weight="900">e</text>
      <text x="62" y="22" fill="#141416" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="18" font-weight="800">eCoinza</text>
      <text x="62" y="46" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Payment request ready</text>
    </g>

    <g transform="translate(814 184)">
      <rect width="154" height="48" rx="24" fill="#ecfdf5"/>
      <circle cx="26" cy="24" r="7" fill="#16a34a"/>
      <text x="44" y="30" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Link active</text>
    </g>

    <circle cx="600" cy="222" r="58" fill="url(#success)"/>
    <path d="M568 221l25 25 43-50" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(224 322)">
      <g transform="translate(0 1)">
        <path d="M7 22 51 4 34 49 25 31 7 22Z" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linejoin="round"/>
        <path d="M24 30 51 4" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="70" y="38" fill="#0a0a0a" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="40" font-weight="800">Share payment link</text>
      <text x="70" y="74" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Collect by link, email, WhatsApp, or QR scan.</text>

      <g transform="translate(0 118)">
        <rect x="0" y="0" width="338" height="76" rx="18" fill="#f7f7f5" stroke="#e8e8e5" stroke-width="2"/>
        <text x="28" y="47" fill="#52525b" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">ecoinza.com/pay/7G4K9...</text>

        <g transform="translate(358 0)">
          <rect width="76" height="76" rx="18" fill="#fff" stroke="#ededed" stroke-width="2"/>
          <path d="M30 23h-7a7 7 0 0 0-7 7v19a7 7 0 0 0 7 7h19a7 7 0 0 0 7-7v-7" fill="none" stroke="#52525b" stroke-width="4" stroke-linecap="round"/>
          <path d="M40 22h17v17M56 23 33 46" fill="none" stroke="#52525b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g transform="translate(450 0)">
          <rect width="76" height="76" rx="18" fill="#fff" stroke="#ededed" stroke-width="2"/>
          <path d="M18 27h40v31H18z" fill="none" stroke="#52525b" stroke-width="4" stroke-linejoin="round"/>
          <path d="m19 28 19 15 19-15" fill="none" stroke="#52525b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g transform="translate(4 230)">
        <rect width="152" height="38" rx="19" fill="#ecfdf5"/>
        <circle cx="22" cy="19" r="6" fill="#16a34a"/>
        <text x="40" y="25" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Ready to send</text>
        <rect x="172" width="174" height="38" rx="19" fill="#fffbeb"/>
        <text x="196" y="25" fill="#9a6700" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">GHS / USDC</text>
      </g>
    </g>

    <g transform="translate(780 314)">
      <rect x="-18" y="-18" width="258" height="300" rx="32" fill="#f7f7f5" stroke="#e8e8e5" stroke-width="2"/>
      <rect x="10" y="10" width="202" height="202" rx="22" fill="#ffffff"/>
      <g fill="#0a0a0a">
        <rect x="30" y="30" width="48" height="48" rx="8"/>
        <rect x="144" y="30" width="48" height="48" rx="8"/>
        <rect x="30" y="144" width="48" height="48" rx="8"/>
        <rect x="43" y="43" width="22" height="22" rx="4" fill="#fff"/>
        <rect x="157" y="43" width="22" height="22" rx="4" fill="#fff"/>
        <rect x="43" y="157" width="22" height="22" rx="4" fill="#fff"/>
        <rect x="94" y="32" width="14" height="14"/>
        <rect x="118" y="32" width="14" height="14"/>
        <rect x="94" y="58" width="14" height="14"/>
        <rect x="128" y="68" width="14" height="14"/>
        <rect x="92" y="94" width="18" height="18"/>
        <rect x="120" y="94" width="14" height="14"/>
        <rect x="148" y="92" width="18" height="18"/>
        <rect x="174" y="100" width="12" height="12"/>
        <rect x="94" y="124" width="14" height="14"/>
        <rect x="122" y="120" width="26" height="14"/>
        <rect x="166" y="124" width="18" height="18"/>
        <rect x="92" y="154" width="16" height="16"/>
        <rect x="120" y="150" width="14" height="14"/>
        <rect x="144" y="144" width="20" height="20"/>
        <rect x="176" y="152" width="18" height="18"/>
        <rect x="104" y="184" width="14" height="14"/>
        <rect x="132" y="176" width="16" height="16"/>
        <rect x="160" y="180" width="12" height="12"/>
        <rect x="184" y="184" width="12" height="12"/>
      </g>
      <circle cx="111" cy="111" r="24" fill="url(#amber)"/>
      <text x="111" y="120" text-anchor="middle" fill="#18120a" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="22" font-weight="900">e</text>
      <text x="111" y="248" text-anchor="middle" fill="#0f766e" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="18" font-weight="800">Scan to pay</text>
      <text x="111" y="273" text-anchor="middle" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Works online or in person</text>
    </g>
  </g>
</svg>
